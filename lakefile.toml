name = "sizeramsey"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SizeRamsey", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "SizeRamsey"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
