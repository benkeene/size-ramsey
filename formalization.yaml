      tool_setup: >-
        GPT-6 Astra as independent prover and adversarial reviewer of the informal argument
        and as repository/Mathlib auditor (read-only), and as author of part of the Lean
        development (Codex jobs from repository snapshots); Claude Code agents writing the Lean
        scaffold and development against a pinned local Lean/Mathlib toolchain with lake build
        feedback.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine (Apple silicon Mac) plus subscription model access"
      prompting_notes: >-
        Astra role prompts (independent prover, adversary, reviewer); never told that a
        proposed argument was probably right.
  spend_usd: "subscription-based"
  notes: >-
    The structural proof attempt was found by GPT-6 Astra (2026-10-16) and adversarially
    checked once by an independent Astra subagent; the scaffold plan is docs/astra/.
    Lean: GPT-6 Astra wrote SizeRamsey/Tightness.lean, Equality/Mixed.lean, Equality/Cubic.lean,
    Equality/TwoRegular.lean, the body of equality_classification (Equality.lean) and
    connected_transversal_le_three (Coloring.lean) (three jobs, aiseminar
    agents/runs/2026-10-16_ramsey-astra/, replies reply_ramsey-{A7,B67,B89}-r1.md), applied
    mechanically; Claude Opus 5.5 coding agents wrote the rest of the development (Stream A:
    Basic, SmallGraphs, FiniteChecks, Deletion, Components, Reductions, Universal; Stream B:
    Upper, ColoringBase, Coloring assembly, Equality/Common, Extension, DegreeFour) on branches
    lean/stream-A and lean/stream-B. Claude Fable 5.1 orchestrated and judged every applied
    declaration by build, axiom audit, per-module leanchecker, signature and frozen-file
    checks. Agent agreement is not evidence; theorem status follows the review protocol of the
    aiseminar laboratory.

