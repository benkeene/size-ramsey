      models: ["GPT-6 Astra (OpenAI)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Codex app-server (for GPT-6 Astra); Claude Code"
      tool_setup: >-
        GPT-6 Astra as independent prover and adversarial reviewer of the informal argument
        and as repository/Mathlib auditor (read-only); Claude Code writing the Lean scaffold
        against a pinned local Lean/Mathlib toolchain with lake build feedback.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine (Apple silicon Mac) plus subscription model access"
      prompting_notes: >-
        Astra role prompts (independent prover, adversary, reviewer); never told that a
        proposed argument was probably right.
  spend_usd: "subscription-based"
  notes: >-
    The structural proof attempt was found by GPT-6 Astra (2026-10-16) and adversarially
    checked once by an independent Astra subagent; the scaffold plan is docs/astra/.
    Lean source written by Claude Code under the direction of the author. Agent agreement
    is not evidence; theorem status follows the review protocol of the aiseminar laboratory.

review:
  status: self-assessed
  reviewers:
    - "Ben Keene"
  notes: >-
    Scaffold stage. One adversarial pass on the informal proof is recorded in
    docs/astra/2026-10-16_workflow_ramsey.md; the full adversary / response / reviewer /
    independent-reconstruction protocol is outstanding. No maintainer review of Lean content.

known_gaps:
  - "Theorems A, B, C and D are admitted in the development library (SizeRamsey.Proof.*)."
  - "The 2018 correction to the n = 3 paper and two 2025 computational papers (Dzido) have not been read."
  - "Novelty of the transversal bound and of the equality classification is unaudited."

limitations:
  - "No novelty claim is made by this scaffold."
  - "The literature status check (docs/STATUS_CHECK.md) is incomplete."

alignment:
  namespace: "SizeRamsey"
  statements:
    - source: "Theorem A: 4 tau_4(G) <= |E(G)| for every finite simple graph G"
      lean: "SizeRamsey.four_mul_tau4_le_edgeCount"
    - source: "Theorem B: connected equality cases through 16 edges are C4, W5, K33-e, K222"
      lean: "SizeRamsey.equality_classification"
    - source: "Corollary C: every connected graph with at most 16 edges has an avoiding colouring"
      lean: "SizeRamsey.avoiding_coloring_le_sixteen"
    - source: "Theorem D: the explicit 17-edge graph is connected and arrows (4K2, C4)"
      lean: "SizeRamsey.F17_spec"
    - source: "rhat_c(4K2, C4) = 17"
      lean: "SizeRamsey.connectedSizeRamsey_eq_seventeen"
