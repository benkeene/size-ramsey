  status: self-assessed
  reviewers:
    - "Ben Keene"
    - "GPT-6 Astra (adversary, reviewer x3, independent prover; 2026-10-16)"
    - "GPT-6 Astra (formal adversary pass 1: meaning, trust; statement reconstruction; 2026-10-17)"
  notes: >-
    The informal proof passed an adversary pass (objections answered), an independent
    reconstruction from the statement alone, a reviewer pass and two confirming reviews (the
    last a clean ACCEPT), recorded in the aiseminar claim_0004 packet. Small-case controls are
    retained in aiseminar experiments/local/2026-10-16_ramsey_e1_small_cases. No external human
    review. The Lean development was completed 2026-10-17 (commit a73d95a): lake build exit 0,
    axiom audit [propext, Classical.choice, Quot.sound] for all five records, per-module
    leanchecker exit 0 on every module. Literal replay 2026-10-17 at HEAD a470609 after lake
    build: "lake env leanchecker SizeRamsey Challenge Solution" followed by the 22 SizeRamsey.*
    modules with a .olean under .lake/build/lib/lean (AxiomAudit has none), 25 modules in all
    (argv in CORRESPONDENCE.md section 10); exit 0, empty output, 1:54.79 wall. This replaces an
    earlier imprecise "all 24 built modules" record. Adversary pass 1 on the formal development
    (GPT-6 Astra, meaning ACCEPT_WITH_FIXES 0.97, trust ACCEPT_WITH_FIXES 0.98, 2026-10-17) found
    no mathematical counterexample and no verification-chain escape; its documentation fixes are
    applied. Independent statement reconstruction (2026-10-17, confidence 0.97, not elaborated by
    its author) is compared item by item in CORRESPONDENCE.md section 13. Reviewer pass pending;
    this is not a claim of formal verification.

