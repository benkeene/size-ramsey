  - "No reviewer pass on the formal development yet (adversary pass 1 done, ACCEPT_WITH_FIXES; statement reconstruction done)."
  - "Corollary C statement of record covers only the colouring half; the transversal half (SizeRamsey.connected_transversal_le_three) is proved but not recorded (TODO(ben))."
  - "AxiomAudit.lean prints axioms without failing on sorryAx, and leanchecker accepts sorryAx-dependent declarations; their outputs must be inspected."
  - "leanchecker --fresh, NanoDa and con-ron not run."
  - "The two 2025 computational papers by Dzido were seen only in abstract (scope: 3K2 and 2K2 versus cycles)."
  - "Novelty of the equality classification B is unestablished (literature audit 2026-10-16, confidence 0.75)."

limitations:
  - "Theorem A follows from Alon-Mubayi-Thomas (2001); the K_{3,3}-e lemma and the 17-edge construction are known (Wijaya et al. 2015; Wang-Song-Zhang-Zhang 2025); the lower bound 16 is Erdős-Faudree (1984). Only B, and through it the value 17, is proposed as new."
  - "No novelty claim is made by this formalization."

