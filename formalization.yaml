version: "v0.4"

project:
  name: "The connected size-Ramsey number of a four-edge matching versus a quadrilateral"
  description: >-
    A Lean 4 / Mathlib formalization project for the connected size-Ramsey equality
    rhat_c(4K2, C4) = 17. The intended proof uses a universal C4 vertex-transversal bound
    4 tau_4(G) <= |E(G)|, a classification of the connected equality cases through sixteen
    edges (C4, the 4-wheel, K_{3,3} minus an edge, the octahedron), an avoiding-colouring
    construction from a three-vertex transversal, and an explicit twelve-vertex,
    seventeen-edge host. Proofs are complete as of commit c8d54e2 (2026-10-17); the proof
    certificate is Solution.lean and its dependency closure. Formal adversary pass 1 and reviewer
    pass 1 are ACCEPT_WITH_FIXES (fixes applied); the CI comparator passed at 38bd345 (2026-10-17)
    with five records. A sixth record, the transversal half of Corollary C
    (SizeRamsey.connected_transversal_le_three), was registered on 2026-10-17 (commit cc2aec2);
    the CI comparator passed with six records at 46bf2d0 (2026-10-17, run 39034260971).
  authors:
    - "Ben Keene"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ben Keene"

repository:
  role: substantive-development

classification:
  arxiv: [math.CO]
  msc2020: ["05C55", "05D10", "05C35"]

status:
  scope: >-
    The proof certificate is Solution.lean and its dependency closure (the SizeRamsey library),
    which does not import Challenge.lean: "lake build Solution" reports zero sorry warnings. The
    default "lake build" also builds Challenge.lean, whose six deliberate sorry warnings are the
    statements of record, so the default build is not described as sorry-free. Kernel-replayed
    locally (leanchecker, 25 modules); adversary pass 1 ACCEPT_WITH_FIXES (meaning 0.97, trust
    0.98) and reviewer pass 1 ACCEPT_WITH_FIXES (0.98), 2026-10-17, documentation fixes applied;
    independent statement reconstruction done (CORRESPONDENCE.md section 13). The reviewer
    recommends FORMALLY_VERIFIED for A, B, C (via two declarations), D for the fixed host and E;
    the endpoint-universal reading of D is not formalized. Since 2026-10-17 (after 38bd345) both
    halves of C are statements of record: the transversal half
    SizeRamsey.connected_transversal_le_three is the sixth record (Challenge.lean, Solution.lean,
    comparator.json, AxiomAudit.lean), proved by a one-line call to the library lemma
    SizeRamsey.Proof.connected_transversal_le_three that the reviewers saw. Lab status (aiseminar claim_0004,
    2026-10-17): FORMALLY_VERIFIED with exactly that scope. Informal proof: lab status
    VERIFIED as an ordinary theorem (2026-10-16, aiseminar claim_0004). At commit c8d54e2
    (2026-10-17) the five statements of record then in Challenge.lean (deliberate sorry) are
    restated and proved in Solution.lean; with the sixth record added (2026-10-17) #print axioms
    of all six is [propext, Classical.choice, Quot.sound] (local run, AxiomAudit.lean, output
    inspected). sorry_count counts occurrences outside Challenge.lean, whose six sorry bodies
    are the statements of record and are excluded by convention. CI comparator at 38bd345
    (2026-10-17, GitHub Actions run 39005389761): "Your solution is okay!"; con-ron (8174
    declarations, --verified), nanoda and the Lean default kernel accepted the five records then
    registered. The sixth record (cc2aec2) was checked locally (pp.all signature identical in
    the Challenge and Solution environments; 25-module leanchecker replay exit 0) and the CI
    comparator then passed with six records at 46bf2d0 (2026-10-17, GitHub Actions run
    39034260971: con-ron accepted 8175 declarations with --verified, nanoda and the Lean default
    kernel accepted; "Your solution is okay!"). Remaining before submission: repository
    visibility (currently private). CORRESPONDENCE.md was read in full by Ben Keene on 2026-10-17.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "SizeRamsey.four_mul_tau4_le_edgeCount"
    - "SizeRamsey.equality_classification"
    - "SizeRamsey.connected_transversal_le_three"
    - "SizeRamsey.avoiding_coloring_le_sixteen"
    - "SizeRamsey.F17_spec"
    - "SizeRamsey.connectedSizeRamsey_eq_seventeen"

fidelity:
  divergences: >-
    Statements of record use graphs on Fin n. Copies of the matching and of the
    quadrilateral are non-induced (injective vertex maps with the required adjacencies).
    Equality cases are whole-graph isomorphism classes (SimpleGraph.Iso). The connected
    size-Ramsey number is defined as a natural-number infimum over connected graphs on
    some Fin n; the defining set is proved nonempty by the explicit witness. Corollary C is
    recorded as two statements, the transversal half SizeRamsey.connected_transversal_le_three
    (sixth record, added 2026-10-17) and the colouring half SizeRamsey.avoiding_coloring_le_sixteen;
    the library proves the transversal half for an arbitrary finite vertex type
    (SizeRamsey.Proof.connected_transversal_le_three) and the record is its Fin n instance. The informal
    D (CLAIM.md, amended 2026-10-17) names a fixed host: two vertex-disjoint copies of K_{3,3}-e
    (parts {0,1,2}, {3,4,5}, missing edge {0,3}) joined by one bridge from vertex 5 of the first
    copy (degree 3 in its copy) to vertex 0 of the second copy (degree 2 in its copy); 12
    vertices, 17 edges. The record F17 is this host with the second copy relabelled 6..11
    (bridge {5,6}). The endpoint-universal statement is mathematically straightforward (each
    copy forces a red 2-matching or a blue C4; the bridge only gives connectedness) but is not
    formalized and not claimed.

sources:
  - title: "Connected size Ramsey numbers of matchings versus a small path or cycle"
    authors: ["Sha Wang", "Ruyu Song", "Yixin Zhang", "Yanbo Zhang"]
    type: "article"
    id: "https://doi.org/10.5614/ejgta.2025.13.1.11"
    relationship: background
    note: >-
      Theorem 1.3 supplies the upper construction (copies of K_{3,3} minus an edge) and
      Conjecture 1 predicts rhat_c(nK2, C4) = floor((9n-1)/2). This project gives its own
      elementary proof of the upper block and a structural proof of the lower bound for n = 4.
  - title: "Connected size Ramsey number for matchings vs. small stars or cycles"
    authors: ["Budi Rahadjeng", "Edy Tri Baskoro", "Hilda Assiyatun"]
    type: "article"
    id: "https://doi.org/10.1007/s12044-017-0366-z"
    relationship: background
    note: "The n = 3 case. The 2018 correction (doi:10.1007/s12044-018-0375-6), retrieved by the 2026-10-16 novelty thread, restricts the claw result rhat_c(nK2, K_{1,3}) = 4n - 1 to n >= 4 and leaves rhat_c(3K2, C4) = 13 standing (docs/STATUS_CHECK.md)."

  - title: "Large induced forests in sparse graphs"
    authors: ["Noga Alon", "Dhruv Mubayi", "Robin Thomas"]
    type: "article"
    id: "https://doi.org/10.1002/jgt.1028"
    relationship: background
    note: "Theorem 1.5 (feedback vertex number of subcubic graphs) implies Theorem A; this project gives its own proof of A as the engine of the equality classification B."
  - title: "All Ramsey (2K2, C4)-minimal graphs"
    authors: ["Kristiana Wijaya", "Lyra Yulianti", "Edy Tri Baskoro", "Hilda Assiyatun", "Djoko Suprijanto"]
    type: "article"
    id: "Journal of Algorithms and Computation 46 (2015) 9-25"
    relationship: background
    note: "Theorem 2.6: K_{3,3} minus an edge arrows (2K2, C4)."
  - title: "Size Ramsey numbers involving matchings"
    authors: ["Paul Erdős", "Ralph J. Faudree"]
    type: "article"
    id: "Colloquia Mathematica Societatis Janos Bolyai 37 (1984) 247-264"
    relationship: background
    note: "Theorem 3: the ordinary size-Ramsey number of (nK2, C4) is 4n, giving the lower bound 16 for n = 4."

