# formalization.yaml v0.4 — adopted from https://github.com/mathlib-initiative/formalization.yaml
version: "v0.4"

project:
  name: "The connected size-Ramsey number of a four-edge matching versus a quadrilateral"
  description: >-
    A Lean 4 / Mathlib formalization project for the connected size-Ramsey equality
    rhat_c(4K2, C4) = 17. The intended proof uses a universal C4 vertex-transversal bound
    4 tau_4(G) <= |E(G)|, a classification of the connected equality cases through sixteen
    edges (C4, the 4-wheel, K_{3,3} minus an edge, the octahedron), an avoiding-colouring
    construction from a three-vertex transversal, and an explicit twelve-vertex,
    seventeen-edge host. The development library is sorry-free as of commit a73d95a
    (2026-10-17); formal review is in progress (adversary pass 1 ACCEPT_WITH_FIXES) and the CI
    comparator is pending.
  authors:
    - "Ben Keene"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ben Keene"

repository:
  role: substantive-development

classification:
  arxiv: [math.CO]
  msc2020: ["05C55", "05D10", "05C35"]

status:
  scope: >-
    Sorry-free Lean development, kernel-replayed locally (per-module leanchecker, 25 modules);
    adversary pass 1 ACCEPT_WITH_FIXES (meaning 0.97, trust 0.98, 2026-10-17; documentation fixes
    applied); independent statement reconstruction done (CORRESPONDENCE.md section 13); reviewer
    pass and CI comparator pending; not formally verified. Informal proof: lab status
    VERIFIED as an ordinary theorem (2026-10-16, aiseminar claim_0004). At commit a73d95a
    (2026-10-17) the five statements of record in Challenge.lean (deliberate sorry) are restated
    and proved in Solution.lean, and #print axioms of all five is [propext, Classical.choice,
    Quot.sound]. sorry_count counts occurrences outside Challenge.lean, whose five sorry bodies
    are the statements of record and are excluded by convention. No Comparator acceptance is
    claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "SizeRamsey.four_mul_tau4_le_edgeCount"
    - "SizeRamsey.equality_classification"
    - "SizeRamsey.avoiding_coloring_le_sixteen"
    - "SizeRamsey.F17_spec"
    - "SizeRamsey.connectedSizeRamsey_eq_seventeen"

fidelity:
  divergences: >-
    Statements of record use graphs on Fin n. Copies of the matching and of the
    quadrilateral are non-induced (injective vertex maps with the required adjacencies).
    Equality cases are whole-graph isomorphism classes (SimpleGraph.Iso). The connected
    size-Ramsey number is defined as a natural-number infimum over connected graphs on
    some Fin n; the defining set is proved nonempty by the explicit witness. The Corollary C
    record states only the avoiding-colouring conclusion; the three-vertex transversal
    conclusion of the informal C is proved as SizeRamsey.connected_transversal_le_three but is
    not a statement of record (TODO(ben): packaging decision). The Theorem D record is one
    specific host (bridge from vertex 5, degree 3 in its copy, to vertex 6, degree 2 in its
    copy); the informal D is read with these endpoints, which suffices for E.

sources:
  - title: "Connected size Ramsey numbers of matchings versus a small path or cycle"
    authors: ["Sha Wang", "Ruyu Song", "Yixin Zhang", "Yanbo Zhang"]
    type: "article"
    id: "https://doi.org/10.5614/ejgta.2025.13.1.11"
    relationship: background
    note: >-
      Theorem 1.3 supplies the upper construction (copies of K_{3,3} minus an edge) and
      Conjecture 1 predicts rhat_c(nK2, C4) = floor((9n-1)/2). This project gives its own
      elementary proof of the upper block and a structural proof of the lower bound for n = 4.
  - title: "Connected size Ramsey number for matchings vs. small stars or cycles"
    authors: ["Budi Rahadjeng", "Edy Tri Baskoro", "Hilda Assiyatun"]
    type: "article"
    id: "https://doi.org/10.1007/s12044-017-0366-z"
    relationship: background
    note: "The n = 3 case; the 2018 correction (doi:10.1007/s12044-018-0375-6) is still to be audited."

  - title: "Large induced forests in sparse graphs"
    authors: ["Noga Alon", "Dhruv Mubayi", "Robin Thomas"]
    type: "article"
    id: "https://doi.org/10.1002/jgt.1028"
    relationship: background
    note: "Theorem 1.5 (feedback vertex number of subcubic graphs) implies Theorem A; this project gives its own proof of A as the engine of the equality classification B."
  - title: "All Ramsey (2K2, C4)-minimal graphs"
    authors: ["Kristiana Wijaya", "Lyra Yulianti", "Edy Tri Baskoro", "Hilda Assiyatun", "Djoko Suprijanto"]
    type: "article"
    id: "Journal of Algorithms and Computation 46 (2015) 9-25"
    relationship: background
    note: "Theorem 2.6: K_{3,3} minus an edge arrows (2K2, C4)."
  - title: "Size Ramsey numbers involving matchings"
    authors: ["Paul Erdős", "Ralph J. Faudree"]
    type: "article"
    id: "Colloquia Mathematica Societatis Janos Bolyai 37 (1984) 247-264"
    relationship: background
    note: "Theorem 3: the ordinary size-Ramsey number of (nK2, C4) is 4n, giving the lower bound 16 for n = 4."

related_formalizations:
  - id: "https://palomar-registry.org/entry?id=PALOMAR-2026-10-07-000005&version=1"
    relationship: other
    note: "Template for layout, module conventions, metadata and verification scripts."

