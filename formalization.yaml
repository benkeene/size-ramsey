      lean: "SizeRamsey.four_mul_tau4_le_edgeCount"
    - source: "Theorem B: connected equality cases through 16 edges are C4, W5, K33-e, K222"
      lean: "SizeRamsey.equality_classification"
    - source: "Corollary C (transversal half): every connected graph with at most 16 edges has a C4-transversal of at most three vertices"
      lean: "SizeRamsey.connected_transversal_le_three"
    - source: "Corollary C (colouring half): every connected graph with at most 16 edges has an avoiding colouring"
