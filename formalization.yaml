    review. Nothing is Lean-verified yet.

known_gaps:
  - "Theorems A, B, C and D are admitted in the development library (SizeRamsey.Proof.*)."
  - "The two 2025 computational papers by Dzido were seen only in abstract (scope: 3K2 and 2K2 versus cycles)."
  - "Novelty of the equality classification B is unestablished (literature audit 2026-10-16, confidence 0.75)."

limitations:
  - "Theorem A follows from Alon-Mubayi-Thomas (2001); the K_{3,3}-e lemma and the 17-edge construction are known (Wijaya et al. 2015; Wang-Song-Zhang-Zhang 2025); the lower bound 16 is Erdős-Faudree (1984). Only B, and through it the value 17, is proposed as new."
  - "No novelty claim is made by this scaffold."

alignment:
  namespace: "SizeRamsey"
  statements:
    - source: "Theorem A: 4 tau_4(G) <= |E(G)| for every finite simple graph G"
      lean: "SizeRamsey.four_mul_tau4_le_edgeCount"
    - source: "Theorem B: connected equality cases through 16 edges are C4, W5, K33-e, K222"
      lean: "SizeRamsey.equality_classification"
    - source: "Corollary C: every connected graph with at most 16 edges has an avoiding colouring"
      lean: "SizeRamsey.avoiding_coloring_le_sixteen"
    - source: "Theorem D: the explicit 17-edge graph is connected and arrows (4K2, C4)"
      lean: "SizeRamsey.F17_spec"
    - source: "rhat_c(4K2, C4) = 17"
      lean: "SizeRamsey.connectedSizeRamsey_eq_seventeen"
